group 'com.mob.mobpush'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
    }
}

apply plugin: 'com.android.library'
def mobCompileSdkVersion = 28
try {
    mobCompileSdkVersion = flutter.compileSdkVersion
    if (rootProject.hasProperty("zzt-compileSdkVersion")) {
        mobCompileSdkVersion = Integer.parseInt(rootProject.getProperty('zzt-compileSdkVersion'))
    }
} catch (Throwable throwable) {

}

android {
    compileSdkVersion mobCompileSdkVersion
    if (project.android.hasProperty("namespace")) {
        namespace 'com.mob.flutter.mobpush'
    }

    defaultConfig {
        minSdkVersion 17
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}
dependencies {
     compileOnly fileTree(include: ['*.jar','*.aar'], dir: 'libs',excludes: [])
}